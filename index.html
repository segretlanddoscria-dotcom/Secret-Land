<style>
:root{--bg:#120c18;--fg:#fff0d0;--gold:#ffd166;--red:#a9362d;--panel:#2a1a3a;--line:#80543e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Press Start 2P',ui-monospace,Menlo,monospace;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px;min-height:100vh;box-sizing:border-box;background:linear-gradient(#24142b,#100d18)}
h1{font-size:.8rem;margin:2px 0 0;color:var(--gold);text-shadow:2px 2px #7b2d26;letter-spacing:1px;font-weight:400}
.wrap{position:relative;width:100%;max-width:960px;touch-action:none}
.stage{position:relative;width:100%}
canvas#c{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid #5b3528;background:#000;box-shadow:0 0 0 3px #1b1018,0 8px 0 #160d13;touch-action:none;box-sizing:border-box}
.pad{display:flex;gap:8px;width:100%;justify-content:space-between;margin-top:10px}
.pg{display:flex;gap:6px}
.pg:first-child{flex:2}.pg:last-child{flex:4}
.pad button{flex:1;padding:16px 0;font-size:1.1rem;background:#392548;color:var(--fg);border:3px solid var(--line);border-radius:0;box-shadow:0 4px 0 #160d18;touch-action:none;font-family:inherit}
.pad button.on,.pad button:active{filter:brightness(.8)}
#bk{background:#2f4a7a}#bj{background:#2f6a3a}#ba{background:#7a2f2f}
#fps{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:3;font:700 9px/1 monospace;color:#7bff7b;background:#0008;padding:2px 4px;border-radius:3px;pointer-events:none}
.top{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:3}
.top button{width:34px;height:34px;border:2px solid #fff6;background:#0007;color:#fff;font-size:1rem;padding:0;touch-action:none}
small{opacity:.65;font-size:.5rem;line-height:1.6;text-align:center}
.rot{display:none}
@media (orientation:portrait) and (pointer:coarse){.rot{display:block}}
#shop{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;gap:6px;padding:12px;box-sizing:border-box;background:rgba(10,6,20,.92);color:#fff;font-size:.6rem;overflow:auto}
#shop b{text-align:center;font-weight:400;color:var(--gold);line-height:1.5}
#shop button{padding:9px;font-size:.55rem;line-height:1.5;border:2px solid #a87955;background:#30203f;color:#fff0d0;font-family:inherit;border-radius:0}
#shop button:disabled{opacity:.4}
#shop button.sel{border-color:#ffd23f;background:#4a3a7a}
#shop.house{background:repeating-linear-gradient(90deg,#3a2415 0 14px,#33200f 14px 15px)}#shop.house b{color:#ffe9b0}
html.ls body{padding:0;gap:0;height:100vh;min-height:0;overflow:hidden;justify-content:center}
html.ls h1,html.ls small{display:none}
html.ls .wrap{max-width:none;width:min(100vw,177.78vh)}
html.ls canvas#c{border:none;box-shadow:none}
html.ls .pad{position:absolute;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom));margin:0;padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));align-items:flex-end;pointer-events:none;box-sizing:border-box}
html.ls .pg{flex:none!important;pointer-events:auto}
html.ls{--bs:calc(clamp(56px,15vh,84px)*var(--bsm,1))}
html.ls .pad button{pointer-events:auto;flex:none;width:var(--bs);height:var(--bs);padding:0;border-radius:50%;opacity:var(--bop,.7);font-size:calc(var(--bs)*.42)}
html.ls .pg:first-child{gap:12px}
html.ls .pg:first-child button{width:calc(var(--bs)*1.2);height:calc(var(--bs)*1.2)}
html.ls .pg:last-child{display:grid;grid-template-columns:auto auto;grid-template-areas:"k s" "a j";gap:8px;align-items:end;justify-items:center}
html.ls #bk{grid-area:k}html.ls #bs{grid-area:s;width:calc(var(--bs)*.8);height:calc(var(--bs)*.8)}html.ls #ba{grid-area:a}
html.lefty .pad{flex-direction:row-reverse}
.pad button.cool{filter:grayscale(1) brightness(.55)}
html.ls #bj{grid-area:j;width:calc(var(--bs)*1.25);height:calc(var(--bs)*1.25)}
html.ls #shop{padding:6px;gap:4px}html.ls #shop button{padding:6px}
html.turn body{position:fixed;top:0;left:var(--th,100vw);width:var(--tw,100vh);height:var(--th,100vw);margin:0;transform-origin:0 0;transform:rotate(90deg);overflow:hidden}
html.turn .wrap{width:min(var(--tw,100vh),calc(var(--th,100vw)*1.7778))}
html.turn .pad{bottom:8px;padding:0 14px}
html.turn{--mw:min(calc(var(--tw,100vh)*.96),900px)}
html.turn #mbg{height:100%;aspect-ratio:auto;object-fit:cover;object-position:center bottom;-webkit-mask-image:none;mask-image:none}
html.turn{--bs:calc(clamp(56px,calc(var(--th,100vw)*.15),84px)*var(--bsm,1))}
#menu{position:fixed;inset:0;z-index:50;display:flex;background:linear-gradient(180deg,#171326 0%,#39203b 58%,#762e25 100%);overflow:auto;padding:16px;box-sizing:border-box}
#mbox{display:flex;flex-direction:column;gap:10px;align-items:center;width:min(92vw,380px);margin:auto;text-align:center;font-size:.6rem;line-height:1.6}
#mbox h2{margin:0;font-size:1rem;font-weight:400;color:var(--gold);text-shadow:3px 3px #7b2d26}
#mbox p{margin:0;opacity:.85}
#mbox .msg{color:#ffd23f;opacity:1}
#mbox button{width:100%;padding:13px;font-size:.7rem;border:3px solid #936344;background:#342044;color:var(--fg);font-family:inherit;box-shadow:0 4px 0 #130b18;border-radius:0}
#mbox button:active{filter:brightness(.85)}
#mbox button.big{background:#a9362d;border-color:#ffd166;font-size:.85rem;text-shadow:2px 2px #54201e}
#mbox button.ghost{background:transparent}
#mbox canvas{width:120px;height:140px;image-rendering:pixelated;background:rgba(255,255,255,.07);border:3px solid #fff2}
#mbox input{width:100%;box-sizing:border-box;padding:12px;font-size:.8rem;text-align:center;border:2px solid #fff4;background:#1c1230;color:#fff;font-family:inherit;-webkit-user-select:text;user-select:text}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lbl{font-size:.55rem;margin-top:4px;color:#ffd166}
#mbox button.sw{width:34px;height:34px;padding:0;border:3px solid #fff3;box-shadow:none}
#mbox button.sw.sel{border-color:#ffd23f;transform:scale(1.12)}
#mbox button.ac{width:auto;padding:8px 10px;font-size:.5rem}
#mbox button.ac.sel{border-color:#ffd23f;background:#5a3a8c}
#mbg{position:fixed;left:0;bottom:0;width:100%;height:100%;object-fit:cover;object-position:center bottom;image-rendering:pixelated;image-rendering:crisp-edges;z-index:-1;pointer-events:none}
@media (max-aspect-ratio:16/10){#mbg{height:auto;aspect-ratio:16/9;object-fit:fill;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28%);mask-image:linear-gradient(to bottom,transparent 0,#000 28%)}}
#mbox{background:rgba(14,8,20,.88);border:3px solid #80543e;box-shadow:0 0 0 3px #1b1018,0 10px 0 #0c060f,0 0 44px rgba(255,120,40,.3);padding:18px 16px;width:var(--mw,min(96vw,900px));box-sizing:border-box}
#mbox h2{font-size:1.25rem;line-height:1.45;letter-spacing:1px}
#mbox button:hover{filter:brightness(1.15)}
#mbox #pv{background:radial-gradient(#4a2a3a,#150d1a)}
.lbl{width:100%;text-align:left;border-bottom:2px solid #fff2;padding-bottom:4px;margin-top:8px}
.lbl::before{content:'▸ '}
#shop{justify-content:safe center}
#shop .chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#shop .chips span{background:#30203f;border:2px solid #a87955;padding:4px 8px;font-size:.5rem}
#shop .srow{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:2px solid #fff2;padding:5px 8px}
#shop .srow .nm{flex:0 0 42%;font-size:.55rem;line-height:1.5}
#shop .srow .ds{font-size:.42rem;opacity:.7}
#shop .srow .bar{flex:1;height:8px;background:#120a18;border:1px solid #fff3}
#shop .srow .bar i{display:block;height:100%;background:linear-gradient(90deg,#4fc3f7,#b388ff)}
#shop .srow .v{width:2em;text-align:right;color:#ffd166;font-size:.65rem}
#shop .srow button{padding:4px 9px;font-size:.7rem}
#shop .sum{font-size:.48rem;line-height:1.7;text-align:center;color:#c9a0ff}

#menu{overflow:hidden;padding:6px}
#mbox{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;align-items:center;padding:10px 14px;font-size:.55rem;line-height:1.5}
#mbox>*{min-width:0}
#mbox .c1,#mbox .c2{display:flex;flex-direction:column;gap:6px;align-items:center}

function tri(x1,y1,x2,y2,x3,y3,c){

function findHouseX(nx,sh){ sh=sh||0;
  const seg=L.ground.find(q=>nx>=q[0]&&nx<=q[1]); if(!seg) return null;
  for(const strict of [true,false]){
    let best=null,bs=1e9;
    for(let x=seg[0]+6;x+34<=seg[1]-6;x+=4){
      if(Math.abs(x+17-nx)<50) continue;
      if(houses.some(q=>Math.abs(q.x-x)<60)) continue;
      if(Math.abs(x-L.shopX)<60||Math.abs(x-L.goalX)<50) continue;
      if(strict&&L.plats.some(q=>x<q[0]+q[2]+6&&x+34>q[0]-6)) continue;
      const sc=Math.abs(Math.abs(x-nx-sh)-150); if(sc<bs){ bs=sc; best=x; }
    }
    if(best!==null) return best;
  }
  return null;
}

function wsURL(){
  let u=''; try{ u=(localStorage.getItem('vc_server')||'').trim(); }catch(_){}
  if(!u&&window.VC_DEFAULT_SERVER) u=String(window.VC_DEFAULT_SERVER).trim();
  if(!u){ return /^https?:$/.test(location.protocol)?((location.protocol==='https:'?'wss://':'ws://')+location.host):''; }
  u=u.replace(/^https?:\/\//,'').replace(/^wss?:\/\//,'').replace(/\/+$/,'');
  const local=/^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(u);
  return (local?'ws://':'wss://')+u;
}
const WSRM={ join(room){ return new Promise((res,rej)=>{

  const api={ presence(o){ if(ws.readyState===1) ws.send(JSON.stringify({t:'pres',p:o})); }, onPeers(f){ cb=f; if(last) f(last); }, leave(){ try{ ws.close(); }catch(_){} } };

    if(m.t==='joined'){ me=m.id; done=true; clearTimeout(to); res(api); }

  ws.onerror=()=>{ if(!done){ clearTimeout(to); rej(new Error('ws')); } };
  ws.onclose=()=>{ clearTimeout(to); if(!done) rej(new Error('closed')); else if(mp.r===api){ mp.r=null; mp.act=[]; if(started&&scene!=='menu') num(P.x+4,P.y-12,'CONEXAO PERDIDA'); } };

(function(){

  const setDir=d=>{ const cur=(keys.r?1:0)-(keys.l?1:0); if(d===cur) return; if(d&&!cur) tapDir(d); keys.l=d<0; keys.r=d>0; bl.classList.toggle('on',d<0); br.classList.toggle('on',d>0); if(d) vib(5); };

  [bl,br].forEach(el=>{
    el.addEventListener('pointerdown',e=>{ if(pid!==null) return; e.preventDefault(); pid=e.pointerId; try{el.setPointerCapture(pid);}catch(_){} hit(e); });
    el.addEventListener('pointermove',e=>{ if(e.pointerId===pid) hit(e); });
    ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,e=>{ if(e.pointerId===pid){ pid=null; setDir(0); } }));

})();

let tapD=0,tapT=0;
function doDash(d){
  if(scene==='room'&&!lost&&!won){ if(P.dsc>0||roomD>0) return; roomD=9; roomDD=d; P.dsc=300; rdir=d; sfx('swing'); return; }

}
function tapDir(d){
  const n=performance.now();
  if(tapD===d&&n-tapT<260){ tapD=0; doDash(d); } else { tapD=d; tapT=n; }
}
function k(e,v){
  const c=e.code; let hit=true;
  const ac=actOf(c);
  if(ac==='l'){ if(v&&!e.repeat&&!keys.l) tapDir(-1); keys.l=v; }
  else if(ac==='r'){ if(v&&!e.repeat&&!keys.r) tapDir(1); keys.r=v; }
  else if(ac==='j') keys.j=v;
  else if(v&&ac==='a') act();
  else if(v&&ac==='k') special();
  else if(v&&ac==='s') swap();
  else if(v&&/^Digit[1-4]$/.test(c)) usePot(+c.slice(5)-1);
  else if(v&&c==='KeyC') toggleStats();
  else if(v&&c==='Escape') document.getElementById('bm').click();
  else if(v&&c==='KeyI') toggleInv();
  else if(v&&c==='KeyR') reset();
  else hit=false;
  if(hit) e.preventDefault();
}

function pollPad(){

  const st={l:ax<-.4||b(14),r:ax>.4||b(15),j:b(0)||b(12),a:b(2)||b(1),k:b(3),s:b(4)||b(5)};
  if(st.l!==gpPrev.l){ keys.l=st.l; if(st.l) tapDir(-1); } if(st.r!==gpPrev.r){ keys.r=st.r; if(st.r) tapDir(1); } if(st.j!==gpPrev.j) keys.j=st.j;
  if(st.a&&!gpPrev.a) act(); if(st.a!==gpPrev.a) keys.a=st.a;
  if(st.k&&!gpPrev.k) special(); if(st.s&&!gpPrev.s) swap();
  gpPrev=st;
}

(function(){
